# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    - go generate ./...

builds:
  - id: envy
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/front-matter/envy/cmd.Version={{ .Version }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

nfpms:
  - id: envy-packages
    ids:
      - envy
    package_name: envy
    file_name_template: "{{ .ConventionalFileName }}"
    homepage: https://envy.front-matter.de
    description: CLI to manage Docker Compose manifests, .env generation, linting, validation, and docs.
    maintainer: Front Matter <hello@front-matter.de>
    vendor: Front Matter
    license: MIT
    section: utils
    priority: optional
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/envy/copyright

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).

homebrew_casks:
  - name: envy
    repository:
      owner: front-matter
      name: homebrew-envy
      # GITHUB_TOKEN in Actions is scoped to this repository and cannot push
      # to the tap, so the tap uses its own token.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # Optional: either set it to Casks, or remove it:
    directory: Casks

    # The binary isn't signed and notarized, so remove the macOS quarantine
    # attribute after install. install_steps uses Homebrew's declarative
    # install steps DSL; {{ .StagedPath }} renders as Homebrew's {{staged_path}}.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/envy"]
          end
